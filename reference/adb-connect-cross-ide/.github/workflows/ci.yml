name: CI
on: [push, pull_request]
jobs:
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
        working-directory: extensions/vscode
      - run: npm run lint
        working-directory: extensions/vscode
